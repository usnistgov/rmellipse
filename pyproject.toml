[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["rmellipse*"]  # package names should match these glob patterns (["*"] by default)
exclude = [""]  # exclude packages matching these glob patterns (empty by default)
namespaces = false

[tool.setuptools.package-data]
myModule = ["*.s2p","*.hdf5"]

[tool.ruff.lint]
ignore = ["F401","E501","F403","F841","E741","I001","E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv.workspace]
members = [
    "tests/workflow-hello",
    "tests/workflow-hello/workspace",
]

# ise PyPi as the index for
# jobs run wth this package,
# all dependencies should be on there.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project]
name = "rmellipse"
dynamic = ["version"]
authors = [
  {name="Daniel C. Gray", email="daniel.c.gray@nist.gov" },
  {name = "Zenn C. Roberts",email = "zenn.roberts@nist.gov"},
  {name ="Aaron M. Hagerstrom", email = "aaron.hagerstrom@nist.gov"},

]
description = "A package for propagating uncertainties according to the GUM."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows"
]

dependencies = [
  "pandas>=2.2.2",
  "numpy>=2.0.0",
  "matplotlib>=3.9.0",
  "h5py>=3.14.0",
  "scipy>=1.15.2",
  "xarray>=2025.3.1", # <2025.6.0",
  "jsonschema>=4.25.0",
  "gitpython>=3.1.45",
  "pydantic>=2.13.4",
]
license-files = ["LICENSE.md"]

[project.scripts]
rme = 'rmellipse._cli:main'

[dependency-groups]
dev = [
    "astroid==3.3.8",
    "numpydoc==1.7.0",
    "pytest==8.3.3",
    "pytest-cov==6.1.1",
    "sphinx>=8.0,<9",
    "sphinx-autoapi==3.6.0",
    "sphinx-gallery==0.17.0",
    "snakeviz>=2.2.2",
    "sphinx-multiversion>=0.2.4",
    "pre-commit>=4.3.0",
    "ruff>=0.13.2",
    "checksumdir>=1.3.0",
    "ipython>=9.16.1",
    "spyder-kernels==3.1.*",
    "myst-parser>=5.1",
    "sphinx-click"
]
