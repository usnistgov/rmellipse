release:
  # name of the release
  title: 'workflow-with-arrschema'
  # version tag
  version: '0.1.0'
  includes:
    - '{array-data}'

# declare files as dependencies within a namespace
# with pattern matching. Files dont have version matching

# declare any additional datasets
datasets:
  array-data-h5: 'data.h5'
  array-data-blob: 'some-file.csv'

dataset-annotations:
  array-data-h5:
    arrschema: '/path/to/schema'
    # someday in the future?
    plots: 'path/to/some/plot.jpg'

jobs:
  make-file:
    outputs:
      - '{array-data-h5}'
    commands:
      - 'uv run make_data.py {array-data-h5} {array-data-blob}'